name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: thakkirni-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      # A fixed "test" release so the newest APK is one tap away on the phone.
      - name: Publish test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk thakkirni.apk
          gh release delete test --yes --cleanup-tag || true
          gh release create test thakkirni.apk --title "ذكرني – نسخة تجربة" --notes "Test build from ${GITHUB_SHA::7}" --prerelease

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter build ios --release --no-codesign

  # The browser version at https://brahemhmdan03-cmd.github.io/thakkirni/
  web:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
      - run: flutter build web --release --no-web-resources-cdn --base-href /thakkirni/
      # The site is served from the gh-pages branch.
      - name: Publish to gh-pages
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Web build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" gh-pages
